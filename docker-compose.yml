services:
  db:
    image: pgvector/pgvector:pg16
    container_name: leascentry-db
    environment:
      POSTGRES_USER: leascentry
      POSTGRES_PASSWORD: leascentry
      POSTGRES_DB: leascentry
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leascentry -d leascentry"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: